# GitHub-first static lane; the live ASUS2 cache mapper is never executed in CI.
name: OCLP7 D97AEW static audit

on:
  push:
    branches:
      - main
    paths:
      - OCLP7_D97AEW_PREBOOT_SUBSTRING_FALSE_POSITIVE_FIX_WRAPPER.command
      - .github/workflows/oclp7-d97aew-static-audit.yml
  pull_request:
    branches:
      - main
    paths:
      - OCLP7_D97AEW_PREBOOT_SUBSTRING_FALSE_POSITIVE_FIX_WRAPPER.command
      - .github/workflows/oclp7-d97aew-static-audit.yml
      - OCLP-Continuity/OCLP_MASTER_CONTINUITY.md
      - OCLP-Continuity/OCLP_HISTORY_INDEX.md
      - OCLP-Continuity/checkpoints/OCLP7_CHECKPOINT_20260902_D97AEV_PREBOOT_SUBSTRING_FALSE_POSITIVE_D97AEW_READY.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-audit:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4

      - name: Record GitHub provenance
        shell: zsh {0}
        run: |
          set -euo pipefail
          echo "D97AEW_CI_REPOSITORY=$GITHUB_REPOSITORY"
          echo "D97AEW_CI_WORKFLOW=$GITHUB_WORKFLOW"
          echo "D97AEW_CI_RUN_ID=$GITHUB_RUN_ID"
          echo "D97AEW_CI_RUN_NUMBER=$GITHUB_RUN_NUMBER"
          echo "D97AEW_CI_JOB=$GITHUB_JOB"
          echo "D97AEW_CI_RUNNER_OS=$RUNNER_OS"
          echo "D97AEW_CI_RUNNER_ARCH=$RUNNER_ARCH"
          echo "D97AEW_CI_HEAD_SHA=$GITHUB_SHA"

      - name: Run validation-only wrapper
        shell: zsh {0}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/Desktop"
          export D97AEW_VALIDATE_ONLY=1
          /bin/zsh ./OCLP7_D97AEW_PREBOOT_SUBSTRING_FALSE_POSITIVE_FIX_WRAPPER.command

      - name: Audit complete static report
        shell: zsh {0}
        run: |
          set -euo pipefail
          report="$HOME/Desktop/OCLP7_D97AEW_PREBOOT_SUBSTRING_FALSE_POSITIVE_FIX_WRAPPER_REPORT.txt"
          test -f "$report"
          grep -F 'D97AEW_BASE_IDENTITY=PASS' "$report"
          grep -F 'D97AEW_SCANNER_TRANSFORM_MATCH_COUNT=1' "$report"
          grep -F 'D97AEW_OLD_SCANNER_AFTER_COUNT=0' "$report"
          grep -F 'D97AEW_NEW_SCANNER_AFTER_COUNT=1' "$report"
          grep -F 'D97AEW_ONLY_FORBIDDEN_SCANNER_CHANGED=PASS' "$report"
          grep -F 'D97AEW_PREBOOT_SAFE_REAL_REBOOT_FORBIDDEN_SYNTHETIC=PASS' "$report"
          grep -F 'D97AEW_RETAINED_D97AEV_IDENTITY_SAFETY_ANCHORS_MISSING=[]' "$report"
          grep -F 'D97AEW_FIXED_D97AEV_ZSH_PARSE=PASS' "$report"
          grep -F 'D97AEW_EMBEDDED_PYTHON_BLOCK_COUNT=1' "$report"
          grep -F 'D97AEW_STATIC_WRAPPER_AUDIT=PASS' "$report"
          grep -F 'D97AEW_GITHUB_STATIC_AUDIT=PASS' "$report"
          grep -F 'D97AEW_ASUS2_MAPPER_EXECUTION=NOT_RUN_IN_GITHUB' "$report"
          grep -F 'SOURCE_MUTATION=NO' "$report"
          grep -F 'SYSTEM_MUTATION=NO' "$report"
          grep -F 'ROOT_PATCH=AUTO-NO' "$report"
          grep -F 'REBOOT=AUTO-NO' "$report"
          printf 'D97AEW_WRAPPER_GIT_BLOB=%s\n' "$(git hash-object OCLP7_D97AEW_PREBOOT_SUBSTRING_FALSE_POSITIVE_FIX_WRAPPER.command)"
          shasum -a 256 OCLP7_D97AEW_PREBOOT_SUBSTRING_FALSE_POSITIVE_FIX_WRAPPER.command

      - name: Upload static audit report
        uses: actions/upload-artifact@v4
        with:
          name: OCLP7-D97AEW-static-audit-report
          path: ~/Desktop/OCLP7_D97AEW_PREBOOT_SUBSTRING_FALSE_POSITIVE_FIX_WRAPPER_REPORT.txt
          if-no-files-found: error
          retention-days: 30
