          assert all(anchor in retrieval for anchor in retrieval_anchors)

          wrapper_rows = []
          for label_name, (path, expected_blob, expected_sha, expected_bytes) in wrappers.items():
              data = path.read_bytes()
              actual_blob = command("git", "hash-object", str(path))
