              assert actual_sha == expected_sha and len(data) == expected_bytes
              assert tree_line.startswith(f"100755 {expected_blob} "), tree_line
              assert stat.S_IMODE(path.stat().st_mode) == 0o755
              wrapper_rows.extend([
                  f"{label_name}_PATH={path}",
