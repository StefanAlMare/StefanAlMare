          stage = package / "stage"
          outer = package / "outer"
          tar_path = outer / "OCLP7-D97AEZ-GITHUB-AUDIT.inner.tar"
          expected = []
          for path in sorted(stage.rglob("*")):
              expected.append(path.relative_to(stage).as_posix() + ("/" if path.is_dir() else ""))
          expected.insert(0, "OCLP7-D97AEZ-GITHUB-AUDIT/")
          expected = sorted(set(expected))

          seen = []
          with tarfile.open(tar_path, "r:") as archive:
              for member in archive.getmembers():
                  normalized = member.name + ("/" if member.isdir() and not member.name.endswith("/") else "")
                  pure = PurePosixPath(member.name)
                  assert not pure.is_absolute() and ".." not in pure.parts
                  assert member.name == "OCLP7-D97AEZ-GITHUB-AUDIT" or member.name.startswith("OCLP7-D97AEZ-GITHUB-AUDIT/")
                  assert member.isdir() or member.isfile()
                  assert not member.issym() and not member.islnk()
                  if member.isdir():
                      assert member.mode == 0o555, (member.name, oct(member.mode))
                  else:
                      assert member.mode == 0o444, (member.name, oct(member.mode))
                  seen.append(normalized)
          assert sorted(seen) == expected, (sorted(seen), expected)
          assert len(seen) == len(set(seen))

          digest = hashlib.sha256(tar_path.read_bytes()).hexdigest()
          sha_line = (outer / "OCLP7-D97AEZ-GITHUB-AUDIT.inner.tar.sha256").read_text().split()[0]
