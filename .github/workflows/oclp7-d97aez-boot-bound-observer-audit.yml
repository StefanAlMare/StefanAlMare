          [[ "$(/usr/bin/git hash-object "$extracted/$D97AEZ_RETRIEVAL_WRAPPER")" == 1f0dcff69943cdd4938a807af5e3841ef61979a0 ]]
          [[ "$(/usr/bin/shasum -a 256 "$extracted/$D97AEZ_ACTIVATION_WRAPPER" | /usr/bin/awk '{print $1}')" == ff22f78f547f5ba50cd7341b2453dac5263b46ed23f2d4f652172b221037c430 ]]
          [[ "$(/usr/bin/shasum -a 256 "$extracted/$D97AEZ_RETRIEVAL_WRAPPER" | /usr/bin/awk '{print $1}')" == 16e91533ca992538a1781fcb64be033b58e6df2598071efe513adfe93062ab7d ]]
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import os
